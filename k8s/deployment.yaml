apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-churn-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bank-churn-service
  template:
    metadata:
      labels:
        app: bank-churn-service
    spec:
      containers:
        - name: api
          image: bank-churn-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: bank-churn-config}
            - secretRef: {name: bank-churn-secrets}
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"

