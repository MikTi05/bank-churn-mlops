[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bank-churn-mlops"
version = "1.0.0"
description = "Reproducible training pipeline for the Bank Churn MLOps project"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "joblib>=1.4,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2.6,<3",
    "scikit-learn>=1.5,<2",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bank_churn_mlops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL in DATABASE_URL"]
