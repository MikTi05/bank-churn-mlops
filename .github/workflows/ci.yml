name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: bank_churn}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d bank_churn"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/bank_churn

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {enable-cache: true}
      - run: uv sync --frozen
      - run: uv run ruff check . --exclude notebooks
      - run: uv run pytest
